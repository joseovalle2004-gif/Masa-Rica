
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Conectando con Webpay | Masa Rica</title>
</head>
<body>

    <h2>Conectando con Webpay Plus...</h2>

    <p>
        Estamos enviándote a la plataforma
        segura de Transbank.
    </p>

    <p>
        No cierres esta ventana.
    </p>

    <form
        id="form-webpay"
        action="{{ url_webpay }}"
        method="POST"
    >
        <input
            type="hidden"
            name="token_ws"
            value="{{ token }}"
        >

        <button type="submit">
            Continuar al pago seguro
        </button>
    </form>

    <script>
        document.getElementById(
            "form-webpay"
        ).submit();
    </script>

</body>
</html>
